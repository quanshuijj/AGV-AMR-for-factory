# ========================================
# 高级滤波器参数
# ========================================

# 数据处理配置
smooth_lagged_data: false             # 不对延迟数据进行平滑 (实时性优先)
history_length: 1.0                  # 保存1秒历史数据用于回溯
predict_to_current_time: true        # 预测到当前时间 (补偿延迟)

# 物理参数
gravitational_acceleration: 9.80665  # 重力加速度 (如果使用IMU加速度)

# 自适应滤波 (高级功能)
dynamic_process_noise_covariance: true  # 不使用动态噪声调整

# 异常处理
reset_on_time_jump: false            # 时间跳跃时不重置滤波器

# ========================================
# 输出和发布配置
# ========================================

# TF发布设置
publish_tf: false                     # 发布TF变换 (map->base_link)
publish_acceleration: false          # 不发布加速度估计

# 状态发布配置  
publish_filtered_gps: false          # 不发布过滤后的GPS (本配置不需要)
use_control: false                   # 不使用控制输入

# ========================================
# 传感器融合策略说明
# ========================================

# 1. 多层次融合策略:
#    - 激光里程计: 主要提供高精度的相对位置和朝向变化
#    - GNSS: 提供绝对位置基准，校正累积漂移  
#    - IMU: 提供高频姿态更新和运动预测

# 2. 时间尺度分工:
#    - 短期 (< 1秒): 主要依赖IMU和激光里程计的高频数据
#    - 中期 (1-60秒): 激光里程计提供准确的相对运动估计
#    - 长期 (> 1分钟): GNSS校正累积漂移，保证全局一致性

# 3. 环境适应性:
#    - 结构化环境: 激光里程计权重较高
#    - 开阔环境: GNSS权重较高
#    - 动态调整: 可通过监控各传感器协方差实现

# 4. 鲁棒性保证:
#    - 单传感器故障: 其他传感器继续工作
#    - 异常值检测: 通过rejection_threshold过滤
#    - 渐进收敛: 初始不确定性逐渐降低

# ================================================================================
# 调试和优化建议
# ================================================================================

# 1. 参数调优步骤:
#    a) 首先确保各传感器数据质量良好
#    b) 逐个启用传感器，观察融合效果  
#    c) 调整process_noise_covariance以平衡响应速度和稳定性
#    d) 设置合适的rejection_threshold过滤异常值

# 2. 性能监控:
#    - 使用print_diagnostics查看传感器状态
#    - 监控各传感器的协方差变化
#    - 观察TF树的连续性和平滑性

# 3. 常见问题排查:
#    - 传感器时间同步问题: 检查时间戳
#    - 坐标系配置错误: 验证TF树结构
#    - 参数设置不当: 对比理论值和实际测量

# 4. 环境相关调优:
#    - 室内环境: 降低GNSS权重，提高激光里程计权重
#    - 室外环境: 平衡各传感器权重
#    - 混合环境: 考虑使用自适应权重调整

# ================================================================================
