min_particles: 500                  # 最小粒子数
max_particles: 3000                 # 最大粒子数
kld_err: 0.01                       # KLD采样误差阈值
laser_model_type: likelihood_field   # 激光模型类型
odom_model_type: diff                # 里程计模型（差分驱动）
update_min_d: 0.2                    # 平移更新阈值(m)
update_min_a: 0.5                    # 旋转更新阈值(rad)
tf_broadcast: true                   # 发布map->odom变换
